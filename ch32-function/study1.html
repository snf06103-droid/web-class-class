<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function - 함수</title>
</head>
<body>
    <h1>함수</h1>
    <p>자바스크립트에서 동작을 표현하는 데이터 형태</p>
    <p>alert(), console.log() 등 기본적으로 브라우저에 설치되어있는 표준내장함수들이 있고 직접 기능을 만드는 사용자 정의함수가 있다.</p>
    <ol>
        <li>함수를 정의 - 정의부</li>
        <li>함수를 실행 - 실행부/호출부</li>
    </ol>
    <script>
        function a(){
            //실행될 소스코드
            alert("test") 
        } //a라는 이름으로 함수 만든 것 a라는 함수는 얼러트로 test라고 찍어주는 함수이다. a라는 함수가 등록만 되고 실행되지는 않는 상태 -> 정의부라고 함
        //a()//a를 실행한다고 해석 -> 실행부/호출부라고 함
        //a()//a를 2번 실행하게 됨
        function b(){
            document.write("<h2>hello!</h2>")
        }
        b()
        b()
        
        function c(name="홍길동",age=10){ //인자의 기본값을 넣어줄 수 있다. c()에 인자가 없다면 입력되어지는 기본값이다. 
            document.write("<p>"+name+"님 안녕하세요</p>")
            document.write(`${name}님은 ${age}살 이시군요 반갑습니다.`)
        }
        c()
        c("장윤서",10)//안에 있는 문자데이터 -> 인자라고 함
        c("최희정",1)//c함수를 최희정이라는 문자데이터를 name의 매개로 하여 출력해라  

        function d(person =[2,"홍길동"]){
            document.write(`<h3>${person[0]}세 ${person[1]}님 반갑습니다.</h3>`)
        }
        d([27,"장윤서"])
        d()
        
        function e(person){
            document.write(`<h3>${person.age}세 ${person.name}님 반갑습니다.</h3>`)
        }
        e({age:27, name:"장윤서"})
        e({name:"장윤서", age:27})//객체데이터는 순서가 아무 상관이 없다 키 밸류 형태이기 때문에 

    </script>
</body>
</html>
