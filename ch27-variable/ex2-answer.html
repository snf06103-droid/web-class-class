<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예제2 새 방식 답안</title>
    <link rel="stylesheet" href="./css/ex2.css">
</head>
<body>
    <div class="wrap">
        <h1>나의 체질량 지수 (BMI)</h1>
        <p>
            체질량 지수는 자신의 몸무게(kg)를 키의 제곱(m)으로 나눈 값입니다.
            체질량지수는 근육량, 유전적 원인, 다른 개인적 차이를 반영하지 못하는 단점이 
            있음에도 불구하고 조사자들이나 의료인들이 가장 많이 쓰는 방법 중 하나입니다. 
        </p>
        <script>
            let userName = prompt("이름을 입력해주시오")
            let userWeight = Number(prompt("몸무게를 입력하시오"))
            let userHeight = Number(prompt("키를 입력하시오"))
            let bmi = (userWeight / Math.pow(userHeight/100,2)).toFixed(2)
            let numberBmi = userWeight / Math.pow(userHeight/100,2)
            let bmiState = numberBmi<=18.5 ? "저체중" : numberBmi<=23 ? "정상" : numberBmi<=25 ? "과체중" : "비만"
            document.write(`
                <dl class="bmi-dl">
                    <dt>이름</dt>
                    <dd>${userName}</dd>
                    <dt>체중</dt>
                    <dd>${userWeight}</dd>
                    <dt>키</dt>
                    <dd>${userHeight}</dd>
                    <dt>bmi</dt>
                    <dd>${bmi}</dd>
                    <dt>상태</dt>
                    <dd>${bmiState}</dd>
                    
                </dl>
            `)
            // let ho = bmi<18.5 ? "저체중" : bmi<23 ? "정상" : bmi<25 ? "과체중" : "비만"

            // document.write(`<p>${userName}님의 bmi지수는 ${ho} 범위 입니다.</p>`)
        </script>

        <div class="bmigrp">
            <span class="t1">BMI</span>
            <span class="t2">체중</span>
            <section class="a">
                저체중
                <span class="t3">18.5</span>
            </section>
            <section class="b">
                정상
                <span class="t4">23</span>
            </section>
            <section class="c">
                과체중
                <span class="t5">25.00</span>
            </section>
            <section class="d">비만</section>
        </div>
    </div>
</body>
</html>
