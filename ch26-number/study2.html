<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학관련도구(함수)</title>
</head>
<body>
    <h1>수학 계산 함수</h1>
    <script>
        console.log(Math.ceil(5.33)) //6
        console.log(Math.floor(5.9)) //5
        console.log(Math.round(5.5)) //6
        console.log(Math.pow(10,2)) //100
        console.log(Math.sqrt(100)) //1
        console.log(Math.abs(-30)) //30
        console.log(Math.max(1,2,6,4,5,3)) //6
        console.log(Math.min(1,-2,6,4,-5,3)) //-5
        console.log(Math.random()) //랜덤 난수
        console.log(123.33321565.toFixed(3)) //"123.333"
    </script>
</body>
</html>
