    <script>
        for( let i=0 ; i<2 ; i++){
            for( let j=0 ; j<3 ; j++){

        } //3중첩까지는 안쓴다.

    <script>
        let colums=prompt("구구단 열을 입력하세요") 
        console.log(colums)
        document.write(`<div class="box" style="grid-template-columns: repeat(${colums},1fr);">`)
        for( let dan=2 ; dan<=9 ; dan++){
            document.write("<ul>")
                for( let b=1 ; b<10 ; b++){
                document.write(`<li>${dan}*${b}=${dan*b}</li>`)
                }
            document.write("</ul>")
        }
        document.write("<div>")
    </script>
