<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object</title>
</head>
<body>
    <h1>객체 - object</h1>
    <p>자바스크립트에서 사물을 나타낼 때 사용하는 표현</p>
    <p>그리고 각각의 프로퍼티는 :(콜론)을 사용하여 key:value형태로 구성되어 있다</p>
    <p>여기서 key값을 사용하여 저장된 value값을 가져올 수 있다. key값은 객체안에 속해있는 변수처럼 활용된다.</p>
    <script>
        let person1 = ["정현진","남자",50]
        console.log(person1[0])//"정현진" 배열 데이터는 순번이 생긴다
        let person2 = {name:"정현진",gender:"남자",age:50} //안에 내용을 원소가 아닌 객체의 속성(프로퍼티)이라고 부름 
        console.log(person2["name"])//저장되는 순서가 중요하지 않다. 객체데이터는 불러올 때 키 값을 입력한다.
        console.log(person2.name) //위와 같은 표현 실무에 더 많이 사용한다.
        let person3 = {name:"장윤서",gender:"여자",age:27} //person2와 다른 폴더가 만들어졌기 때문에 에러가 나지 않는다.
        person3.name[1]//"장윤서"[1] -> "윤"
        person3.gender.length-2?"A":"B"//2-2는 0이기 때문에 "B"가 남는다.
        


    </script>
</body>
</html>
